name: Build Crazy Elevator Web

on:
  workflow_dispatch:
  push:
    paths:
      - "games/crazy-elevator/**"
      - ".github/workflows/web.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install love.js
        run: npm install -g love.js

      - name: Create LÖVE package
        run: |
          cd games/crazy-elevator
          zip -r CrazyElevator.love main.lua

      - name: Build Web version
        run: |
          rm -rf games/crazy-elevator-web
          love.js games/crazy-elevator/CrazyElevator.love games/crazy-elevator-web -c -t "Crazy Elevator"

      - name: Fix Web layout
        run: |
          cat > games/crazy-elevator-web/theme/gamehub.css <<'EOF'
          html,
          body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
          }

          body {
            display: flex;
            align-items: center;
            justify-content: center;
          }

          body > center {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
          }

          body > center > div {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
          }

          body h1 {
            display: none;
          }

          #loadingCanvas,
          #canvas {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            margin: 0;
            padding: 0;
            border: 0;
          }

          #canvas {
            visibility: visible;
          }
          EOF

          sed -i 's#</head>#<link rel="stylesheet" type="text/css" href="theme/gamehub.css"></head>#' games/crazy-elevator-web/index.html

      - name: Publish Web build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@github.com"
          git add games/crazy-elevator-web
          git diff --cached --quiet || git commit -m "Update Crazy Elevator web build"
          git push
