<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رحلة | Game Hub</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <div>
        <h1>🎮 رحلة</h1>
        <p>Game Hub</p>
    </div>

    <div class="status">
        ● ONLINE
    </div>

</header>


<main>

    <section class="hero">

        <div>
            <span class="badge">MY GAMES</span>

            <h2>ألعابنا، بمكان واحد.</h2>

            <p>
                مكتبة ألعاب صغيرة من تطويرنا،
                وتكبر لعبة بعد لعبة.
            </p>
        </div>

    </section>


    <section class="tools">

        <input
            id="search"
            type="search"
            placeholder="🔎 ابحث عن لعبة..."
        >

        <select id="category">

            <option value="all">
                كل الألعاب
            </option>

            <option value="horror">
                رعب
            </option>

            <option value="cars">
                سيارات
            </option>

            <option value="other">
                أخرى
            </option>

        </select>

    </section>


    <section>

        <div class="section-title">

            <h2>🎮 الألعاب</h2>

            <span id="gameCount">
                1 لعبة
            </span>

        </div>


        <div id="games" class="games">


            <article
                class="game-card"
                data-name="crazy elevator"
                data-category="horror"
            >

                <div class="game-image elevator">
                    🛗
                </div>

                <div class="game-info">

                    <span class="tag horror">
                        رعب
                    </span>

                    <h3>
                        Crazy Elevator
                    </h3>

                    <p>
                        المصعد مو طبيعي مثل ما تتوقع... 👀
                    </p>

                    <button
                        onclick="playGame('crazy-elevator')"
                    >
                        ▶ العب الآن
                    </button>

                </div>

            </article>


        </div>

    </section>

</main>


<footer>

    <p>
        © 2026 رحلة Game Hub
    </p>

</footer>


<script>

const search =
    document.getElementById("search");

const category =
    document.getElementById("category");

const games =
    document.querySelectorAll(".game-card");

const gameCount =
    document.getElementById("gameCount");


function filterGames() {

    const text =
        search.value.toLowerCase();

    const cat =
        category.value;

    let visible = 0;


    games.forEach(game => {

        const name =
            game.dataset.name;

        const gameCategory =
            game.dataset.category;


        const matchesSearch =
            name.includes(text);

        const matchesCategory =
            cat === "all" ||
            gameCategory === cat;


        if (
            matchesSearch &&
            matchesCategory
        ) {

            game.style.display = "";

            visible++;

        } else {

            game.style.display = "none";

        }

    });


    gameCount.textContent =
        visible + " لعبة";

}


search.addEventListener(
    "input",
    filterGames
);


category.addEventListener(
    "change",
    filterGames
);


function playGame(game) {

    if (
        game === "crazy-elevator"
    ) {

        alert(
            "🚧 Crazy Elevator\n\nالمشغل قيد التجهيز!"
        );

    }

}


</script>

</body>

</html>
